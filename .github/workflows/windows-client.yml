name: Windows classroom client

on:
  workflow_dispatch:
  push:
    paths:
      - "windows-client/**"
      - ".github/workflows/windows-client.yml"
  pull_request:
    paths:
      - "windows-client/**"
      - ".github/workflows/windows-client.yml"

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: big-fat-fish-classroom-windows
          path: windows-client/release/*.exe
          if-no-files-found: error
          retention-days: 14
